<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>commeat</title>
    <!-- Apply the saved theme before first paint; keep the key in step with src/lib/theme.ts -->
    <script>
      try {
        if (localStorage.getItem('commeat-theme') === 'dusk') document.documentElement.dataset.theme = 'dusk'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
